<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F6F5F1"><title>Pantry Pals</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>:root{
  --bg:#F6F5F1; --card:#fff; --ink:#18201C; --muted:#6B736F; --line:#ECEAE4;
  --green:#2F7D5B; --green-2:#3FA374; --mint:#E4F2EA; --lav:#7C5CE0; --lav-soft:#EFEAFD;
  --red:#C8453A; --radius:18px;
  --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:disabled{opacity:.45;cursor:default}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding:0 16px 120px}
.muted{color:var(--muted)} .small{font-size:13px}
h1{font-size:30px;margin:10px 0 4px;letter-spacing:-.02em}
h2{font-size:17px;margin:0;letter-spacing:-.01em}

.top{display:flex;align-items:center;justify-content:space-between;padding:18px 2px 10px;position:sticky;top:0;background:var(--bg);z-index:5}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:-.02em}
.mascot{display:inline-flex}
.avatar{width:38px;height:38px;border-radius:50%;color:#fff;font-weight:700;display:grid;place-items:center}

.tabs{display:flex;background:#EAE8E2;border-radius:14px;padding:4px;margin:4px 0 16px}
.tabs button{flex:1;padding:9px;border-radius:11px;font-weight:600;color:var(--muted)}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}

.card{background:var(--card);border-radius:var(--radius);box-shadow:0 1px 2px rgba(20,30,25,.05),0 0 0 1px var(--line)}
.card.add{padding:12px;margin-bottom:22px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;align-items:center}
.row.between{justify-content:space-between}
.field{width:100%;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);background:#FBFAF8;font:inherit;color:inherit;outline:none}
.field:focus{border-color:var(--green-2);background:#fff}
.field.code{text-align:center;letter-spacing:.15em;font-weight:700;text-transform:uppercase}
.add-btn{width:48px;height:48px;flex:none;font-size:24px;padding:0}

.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{padding:7px 12px;border-radius:999px;background:#F1EFEA;font-size:14px;font-weight:600;color:var(--muted)}
.pill.on.repeat{background:var(--mint);color:var(--green)}
.pill.on.once{background:var(--lav-soft);color:var(--lav)}

.stepper{display:flex;align-items:center;background:#F1EFEA;border-radius:999px}
.stepper button{width:34px;height:34px;font-size:18px;font-weight:700;color:var(--muted)}
.stepper .qtyval{min-width:24px;text-align:center;font-weight:700;font-size:14px}
.stepper.sm button{width:28px;height:28px;font-size:16px}
.stepper.sm .qtyval{min-width:30px;font-size:13px}

section{margin-bottom:22px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:0 4px 8px}
.card.list{overflow:hidden}
.item{display:flex;align-items:center;gap:10px;padding:12px 12px 12px 14px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item-main{flex:1;min-width:0;text-align:left;padding:0}
.item-main .name{font-weight:650;font-size:16px;line-height:1.3;overflow-wrap:anywhere}
.item-main .meta{color:var(--muted);font-size:12.5px;margin-top:3px;display:flex;align-items:center;flex-wrap:wrap;gap:0 4px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:3px}
.tag{font-size:10.5px;font-weight:700;background:#FFF1E3;color:#C2621F;border-radius:6px;padding:2px 6px;margin-left:6px;vertical-align:2px}
.item-side{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.acts{display:flex;gap:6px}
.mini{padding:6px 11px;border-radius:999px;font-size:13px;font-weight:650;background:#F1EFEA;color:var(--muted)}
.mini.on{background:#FFF4D6;color:#9A6B00}
.mini.buy{background:var(--green);color:#fff}
.item.skipped .name{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1.5px}
.skiptxt{color:#9A6B00}

.btn{padding:13px 18px;border-radius:14px;font-weight:700}
.btn.primary{background:var(--green);color:#fff}
.btn.primary:active{background:#276A4D}
.btn.ghost{background:#EAE8E2}
.btn.danger{background:transparent;color:var(--red)}
.btn.wide{width:100%}
.btn.big{padding:16px;font-size:17px}
.row .btn{flex:1}

.buybar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%);z-index:6}
.buybar .btn{max-width:528px;margin:0 auto;display:block;box-shadow:0 8px 24px rgba(47,125,91,.3)}

.empty{text-align:center;padding:30px 20px;color:var(--ink)}
.empty p{margin:8px 0 0}
.center{min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px}
.welcome{padding-top:9vh;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px}
.welcome .field,.welcome .btn{max-width:380px}
.welcome p.muted{max-width:320px;margin:0 0 10px}
.lbl{font-size:13px;font-weight:700;color:var(--muted);align-self:flex-start;margin:6px 0 -4px}
.welcome .lbl{align-self:center}
.note{background:#FFF4D6;color:#7A5600;padding:10px 14px;border-radius:12px;font-size:14px}
.or{width:100%;max-width:380px;display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;margin:8px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-3deg)}}

.sheet-wrap{position:fixed;inset:0;background:rgba(15,20,17,0);display:flex;align-items:flex-end;justify-content:center;z-index:20;transition:background .2s}
.sheet-wrap.open{background:rgba(15,20,17,.38)}
.sheet{width:100%;max-width:560px;max-height:88vh;overflow:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;transform:translateY(100%);transition:transform .22s ease}
.sheet-wrap.open .sheet{transform:none}
.grab{width:40px;height:5px;border-radius:9px;background:#D8D5CE;margin:0 auto 6px}
.sheet h2{font-size:20px}
.buylist{margin:4px 0}
.codebox{background:#fff;border:1.5px dashed var(--green-2);border-radius:14px;padding:14px;text-align:center;font-size:24px;font-weight:800;letter-spacing:.14em;color:var(--green)}
.linkbtn{color:var(--green);font-weight:700;align-self:flex-start;padding:2px 0}

#toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.2s;z-index:30;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.thumb{width:48px;height:48px;border-radius:12px;object-fit:contain;background:#fff;box-shadow:0 0 0 1px var(--line);flex:none}
.thumb.ph{display:grid;place-items:center;font-size:20px;background:#F4F2ED;box-shadow:none}
.item.skipped .thumb{opacity:.45}
.add-btn{display:grid;place-items:center;line-height:1;padding:0 0 3px}
.add-btn::before{content:none}
.field::placeholder{color:#9AA19D}
.sec-buy{padding:10px 12px 12px;border-top:1px solid var(--line)}
.sec-buy .btn.once{background:var(--lav)}
.sec-buy .btn.once:active{background:#6747C9}
.price{font-size:14px;font-weight:700;color:var(--green);margin-top:2px}
.price .muted{font-weight:500;font-size:12.5px}
.total{font-size:18px;font-weight:800;margin:0;color:var(--green)}
#app{padding-bottom:40px}
.row .add-btn{flex:0 0 50px;width:50px;height:50px;padding:0}
.add-btn svg{display:block}
.buybody{display:flex;flex-direction:column;gap:10px}
.adding{text-align:center;padding:20px 0}
.adding p{margin:6px 0 0;font-weight:600}
.st{font-size:12.5px;font-weight:700;padding:4px 8px;border-radius:8px}
.st.ok{background:var(--mint);color:var(--green)}
.st.bad{background:#FDECEA;color:var(--red)}
.result-line{font-weight:700;margin:0}
.ebag-row{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;border-radius:14px;padding:10px 10px 10px 14px;box-shadow:0 0 0 1px var(--line);font-weight:600}
.ebag-row .btn{padding:10px 14px}
</style></head><body><div id="app"></div><div id="toast"></div>
